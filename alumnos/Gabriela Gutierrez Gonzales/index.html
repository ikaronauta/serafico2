<!DOCTYPE html>
<html lang="es">
<head>
   
    <title>Make Up</title>
    <style>
        /* Estilos generales */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Estilos para el título y subtítulo */
        h1 {
            color: #00698f;
            font-size: 36px;
            text-align: center;
        }

        h2 {
            color: #666;
            font-size: 24px;
            text-align: center;
        }

        /* Estilos para la imagen */
        .megenPrint {
            width: 300px;
            height: 400px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
           
            margin: 0 auto;
        }

        /* Estilos para los párrafos */
        #contenedor p {
            font-size: 18px;
            margin-bottom: 20px;
            text-align: center;
        }

        #contenedor p:nth-child(3) {
            color: #009900;
        }

        #contenedor p:nth-child(4) {
            color: #990000;
        }

        /* Estilos para el footer */
        footer {
            background-color: #333;
            color: #fff;
            padding: 10px;
            text-align: center;
            clear: both;
        }
    </style>
</head>
<body>
    <h1>Make Up</h1>
    <h2>By: Gaby</h2>
    <div id="contenedor">
        <img src="https://i.pinimg.com/736x/bd/38/53/bd3853c9a9fdff5dc207a33d70fbcd93.jpg" alt="Imagen de maquillaje" class="megenPrint">
        <p>maquillaje profesional</p>
        <p>contácteme, domicilios y local  </p>
    </div>
    <footer>
        <p>Desarrollado por Gaby</p>
    </footer>
</body>
</html>
